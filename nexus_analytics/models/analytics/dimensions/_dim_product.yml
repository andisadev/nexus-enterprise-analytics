version: 2

models:
  - name: dim_product
    description: >
      Product dimension containing descriptive and pricing
      attributes for product analysis. One row per product.

    columns:
      - name: product_key
        description: Warehouse surrogate key.
        data_tests:
          - unique
          - not_null

      - name: product_id
        description: Original product business identifier.
        data_tests:
          - unique
          - not_null

      - name: product_name
        data_tests:
          - not_null

      - name: category
        data_tests:
          - not_null

      - name: list_price
        data_tests:
          - not_null

      - name: standard_cost
        data_tests:
          - not_null

      - name: product_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Active', 'Inactive']