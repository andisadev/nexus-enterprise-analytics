
version: 2

models:
  - name: fct_sales
    description: >
      Sales transaction fact table containing one row per sales order.
      Includes all order statuses and separates completed sales value
      from pending, returned, and cancelled order values.

    columns:
      - name: order_id
        description: Unique identifier for each sales order.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Customer identifier associated with the order.
        data_tests:
          - not_null

      - name: product_id
        description: Product identifier associated with the order.
        data_tests:
          - not_null

      - name: sales_rep_id
        description: Sales representative identifier.
        data_tests:
          - not_null

      - name: order_date
        description: Date the sales order was placed.
        data_tests:
          - not_null

      - name: order_date_key
        description: Foreign key to the date dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: order_status
        description: Current order lifecycle status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Completed
                  - Pending
                  - Cancelled
                  - Returned

      - name: quantity
        description: Number of units ordered.
        data_tests:
          - not_null

      - name: net_order_value
        description: Order value after discounts.
        data_tests:
          - not_null

      - name: completed_sales_amount
        description: Net order value for completed orders; zero otherwise.
        data_tests:
          - not_null
